[Service]
# AWS-only key paths for the Samsung Windows widget. Quote and real-order
# authority stay separate. The containing directory is root:www-data 750;
# both files are root-owned, group-readable only by www-data, and are never
# stored in this repository.
Environment="KORSTOCKSCAN_SAMSUNG_WIDGET_ACCESS_KEY_FILE=/etc/korstockscan/samsung-price-widget.key"
Environment="KORSTOCKSCAN_SAMSUNG_WIDGET_ORDER_KEY_FILE=/etc/korstockscan/samsung-price-widget-order.key"
