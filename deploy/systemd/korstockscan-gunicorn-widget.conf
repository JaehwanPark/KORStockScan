[Service]
# AWS-only access-key path for the read-only Windows Samsung price widget.
# The containing directory is root:www-data 750; the key file is root-owned,
# group-readable only by www-data, and is never stored in this repository.
Environment="KORSTOCKSCAN_SAMSUNG_WIDGET_ACCESS_KEY_FILE=/etc/korstockscan/samsung-price-widget.key"
