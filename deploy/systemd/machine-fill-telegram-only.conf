# Apply only to the three widget collectors and widget-signal-auto-trader.
# The independent machine-fill service owns both BUY and SELL fill notices.
[Service]
Environment="KORSTOCKSCAN_DOOSAN_WIDGET_TELEGRAM_ENABLED=false"
Environment="KORSTOCKSCAN_HANWHA_OCEAN_WIDGET_TELEGRAM_ENABLED=false"
Environment="KORSTOCKSCAN_SAMSUNG_WIDGET_TELEGRAM_ENABLED=false"
Environment="KORSTOCKSCAN_SAMSUNG_WIDGET_ENTRY_TELEGRAM_ENABLED=false"
Environment="KORSTOCKSCAN_WIDGET_AUTO_TRADER_ENTRY_TELEGRAM_ENABLED=false"
